name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: build/reports/tests/test/

  ui-tests:
    name: UI E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Xvfb and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxrender1 libxtst6 libxi6 \
            libxrandr2 libxcomposite1 libxcursor1 libxdamage1 \
            libxfixes3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 \
            libnss3 libnspr4 libasound2t64 libgbm1 libdrm2 \
            libcups2 libpango-1.0-0 libcairo2 fonts-liberation

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX &
          sleep 2

      - name: Start IDE for UI tests
        run: |
          ./gradlew runIdeForUiTests &
          echo "IDE starting in background..."

      - name: Wait for robot-server
        run: |
          echo "Waiting for robot-server on port 8082..."
          timeout=300
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -sf http://localhost:8082 > /dev/null 2>&1; then
              echo "Robot server is ready (after ${elapsed}s)"
              exit 0
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "ERROR: Robot server not ready after ${timeout}s"
          exit 1

      - name: Run UI tests
        id: uitest
        run: ./gradlew uiTest --info 2>&1 | tee /tmp/ui-test-output.txt
        continue-on-error: true

      - name: Post UI test results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('/tmp/ui-test-output.txt', 'utf8');
            } catch (e) {
              output = 'No test output captured.';
            }

            // Extract test summary and failures
            const lines = output.split('\n');
            const failures = lines.filter(l =>
              l.includes('FAILED') || l.includes('WaitForConditionTimeoutException') ||
              l.includes('tests completed') || l.includes('[waitForIde]') ||
              l.includes('[screenshot]') || l.includes('[triggerVfsRefresh]') ||
              l.includes('STANDARD_OUT') || l.includes('STANDARD_ERR')
            ).slice(0, 80);

            const summaryLine = lines.find(l => l.includes('tests completed')) || 'No summary found';
            const status = '${{ steps.uitest.outcome }}' === 'success' ? '✅' : '❌';

            const body = [
              `## ${status} UI E2E Test Results`,
              '',
              `**Status:** ${summaryLine.trim()}`,
              '',
              '<details><summary>Test output (failures & diagnostics)</summary>',
              '',
              '```',
              failures.join('\n').substring(0, 60000),
              '```',
              '</details>',
              '',
              `[Full logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            ].join('\n');

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## ✅ UI E2E Test Results';
            const markerFail = '## ❌ UI E2E Test Results';
            const existing = comments.find(c =>
              c.body?.startsWith(marker) || c.body?.startsWith(markerFail)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if UI tests failed
        if: steps.uitest.outcome == 'failure'
        run: exit 1

      - name: Upload UI test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: |
            build/reports/tests/uiTest/
            build/idea-sandbox/system/log/

  playwright-tests:
    name: Playwright Snapshot Saver Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/playwright-snapshot-saver/package-lock.json

      - name: Install dependencies
        working-directory: packages/playwright-snapshot-saver
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: packages/playwright-snapshot-saver
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: packages/playwright-snapshot-saver
        run: npm test

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-reports
          path: packages/playwright-snapshot-saver/test-results/
