name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: build/reports/tests/test/

      - name: Upload test report to dashboard
        if: success() || failure()
        run: |
          cd build/reports/tests/test && zip -r ../../../../unit-test-report.zip . && cd ../../../..
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RD_TOKEN }}" \
            -F "report=@unit-test-report.zip" \
            "https://reports.artemon.cloud/api/v1/upload?\
          suite=unit-tests&\
          run_id=${{ github.run_id }}&\
          run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}&\
          job_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}&\
          git_ref=${{ github.ref_name }}&\
          git_sha=${{ github.sha }}"

  ui-tests:
    name: UI E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DISPLAY: ':99'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Xvfb and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxrender1 libxtst6 libxi6 \
            libxrandr2 libxcomposite1 libxcursor1 libxdamage1 \
            libxfixes3 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 \
            libnss3 libnspr4 libasound2t64 libgbm1 libdrm2 \
            libcups2 libpango-1.0-0 libcairo2 fonts-liberation

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX &
          sleep 2

      - name: Start IDE for UI tests
        run: |
          ./gradlew runIdeForUiTests &
          echo "IDE starting in background..."

      - name: Wait for robot-server
        run: |
          echo "Waiting for robot-server on port 8082..."
          timeout=300
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            if curl -sf http://localhost:8082 > /dev/null 2>&1; then
              echo "Robot server is ready (after ${elapsed}s)"
              exit 0
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "ERROR: Robot server not ready after ${timeout}s"
          exit 1

      - name: Run UI tests
        run: ./gradlew uiTest --info

      - name: Upload UI test reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: |
            build/reports/tests/uiTest/
            build/reports/uiTest/traces/
            build/screenshots/uiTest/
            build/idea-sandbox/system/log/

      - name: Upload UI test report to dashboard
        if: success() || failure()
        run: |
          cd build/reports/tests/uiTest && zip -r ../../../../ui-test-report.zip . && cd ../../../..
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RD_TOKEN }}" \
            -F "report=@ui-test-report.zip" \
            "https://reports.artemon.cloud/api/v1/upload?\
          suite=ui-tests&\
          run_id=${{ github.run_id }}&\
          run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}&\
          job_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}&\
          git_ref=${{ github.ref_name }}&\
          git_sha=${{ github.sha }}"

      - name: Upload UI trace bundles to dashboard
        if: success() || failure()
        env:
          RD_TOKEN: ${{ secrets.RD_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_REF: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: |
          # `finalizedBy("generateTraceIndex")` already wrote the index on the
          # Gradle side; make doubly sure it exists before zipping so the
          # dashboard suite URL always resolves to a landing page.
          ./gradlew generateTraceIndex --quiet || true
          if [ ! -d build/reports/uiTest/traces ] || [ -z "$(ls -A build/reports/uiTest/traces 2>/dev/null)" ]; then
            echo "No trace bundles produced — skipping ui-test-traces upload."
            exit 0
          fi
          (cd build/reports/uiTest/traces && zip -r ../../../../ui-test-traces.zip .)
          URL="https://reports.artemon.cloud/api/v1/upload?suite=ui-test-traces&run_id=${RUN_ID}&run_url=${RUN_URL}&job_url=${RUN_URL}&git_ref=${GIT_REF}&git_sha=${GIT_SHA}"
          curl -X POST -H "Authorization: Bearer ${RD_TOKEN}" -F "report=@ui-test-traces.zip" "$URL"

  playwright-tests:
    name: Playwright Snapshot Saver Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/playwright-snapshot-saver/package-lock.json

      - name: Install dependencies
        working-directory: packages/playwright-snapshot-saver
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: packages/playwright-snapshot-saver
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        working-directory: packages/playwright-snapshot-saver
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-reports
          path: packages/playwright-snapshot-saver/test-results/

      - name: Upload Playwright report to dashboard
        if: success() || failure()
        run: |
          cd packages/playwright-snapshot-saver/playwright-report && zip -r ../../../playwright-report.zip . && cd ../../..
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RD_TOKEN }}" \
            -F "report=@playwright-report.zip" \
            "https://reports.artemon.cloud/api/v1/upload?\
          suite=playwright-tests&\
          run_id=${{ github.run_id }}&\
          run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}&\
          job_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}&\
          git_ref=${{ github.ref_name }}&\
          git_sha=${{ github.sha }}"
