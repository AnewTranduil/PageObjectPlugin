<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Internet - Login Page</title>
  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    #page-footer {
      text-align: center;
      padding: 20px 0;
      color: #999;
      font-size: 12px;
      border-top: 1px solid #e5e5e5;
      margin-top: 40px;
    }
    #content {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #333;
      font-size: 36px;
    }
    h4 {
      text-align: center;
      color: #666;
      font-weight: normal;
    }
    #login {
      max-width: 300px;
      margin: 20px auto;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: bold;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 14px;
    }
    button[type="submit"] {
      background-color: #2ba6cb;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button[type="submit"]:hover {
      background-color: #2594b5;
    }
    #flash {
      padding: 10px 20px;
      border-radius: 4px;
      margin-bottom: 15px;
      display: none;
      position: relative;
    }
    #flash.error {
      display: block;
      background-color: #c60f13;
      color: white;
    }
    #flash.success {
      display: block;
      background-color: #5da423;
      color: white;
    }
    #flash .close {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 18px;
    }
    a {
      color: #2ba6cb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div id="content" class="large-12 columns">
    <h2>Login Page</h2>
    <h4>This is where you can log into the secure area. Enter <em>tomsmith</em> as username and <em>SuperSecretPassword!</em> as password.</h4>

    <div id="flash" role="alert" class="error">Your username is invalid! <span class="close" onclick="this.parentElement.style.display='none'">×</span></div>

    <div id="login">
      <form id="login-form" data-testid="login-form">
        <div class="row">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" data-testid="login-username" placeholder="Username" style="">
        </div>
        <div class="row">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" data-testid="login-password" placeholder="Password" style="">
        </div>
        <button type="submit" data-testid="login-button"><i class="fa fa-sign-in"></i> Login</button>
      </form>
    </div>
  </div>

  <div id="page-footer">
    <p>Powered by <a href="http://elementalselenium.com/" target="_blank">Elemental Selenium</a></p>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const flash = document.getElementById('flash');

      if (username === 'tomsmith' && password === 'SuperSecretPassword!') {
        flash.className = 'success';
        flash.innerHTML = 'You logged into a secure area! <span class="close" onclick="this.parentElement.style.display=\'none\'">&times;</span>';
      } else {
        flash.className = 'error';
        flash.innerHTML = 'Your username is invalid! <span class="close" onclick="this.parentElement.style.display=\'none\'">&times;</span>';
      }
    });
  </script>


</body></html>
