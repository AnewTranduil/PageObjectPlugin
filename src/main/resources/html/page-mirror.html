<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Mirror</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1e1e1e;
            color: #cccccc;
            font-family: monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #status {
            padding: 8px 12px;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        #viewport-container {
            flex: 1;
            position: relative;
            overflow: auto;
            display: none;
        }
        #viewport {
            width: 100%;
            height: 100%;
        }
        #viewport iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        .highlight-box {
            position: absolute;
            border: 2px solid #3b82f6;
            background: rgba(59, 130, 246, 0.3);
            pointer-events: none;
            transition: all 0.15s ease;
        }
        .highlight-box.not-found {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
        }
        .highlight-tooltip {
            position: absolute;
            background: #1e1e1e;
            color: #ccc;
            border: 1px solid #3b82f6;
            border-radius: 3px;
            padding: 3px 6px;
            font-size: 11px;
            font-family: monospace;
            white-space: nowrap;
            pointer-events: none;
            z-index: 1001;
        }
        .inspect-highlight {
            position: absolute;
            border: 2px solid #22c55e;
            background: rgba(34, 197, 94, 0.2);
            pointer-events: none;
            z-index: 999;
        }
        .inspect-active #overlay {
            pointer-events: auto;
            cursor: crosshair;
        }
        #empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="status">Page Mirror Ready</div>
    <div id="viewport-container">
        <div id="viewport"></div>
        <div id="overlay"></div>
    </div>
    <div id="empty-state">No snapshot loaded</div>

    <script>
        var _layoutElements = [];
        var _layoutMap = {};

        window.loadSnapshot = function(html, layoutJson) {
            var viewport = document.getElementById('viewport');
            var container = document.getElementById('viewport-container');
            var emptyState = document.getElementById('empty-state');
            var status = document.getElementById('status');

            // Create iframe with srcdoc to avoid CSS bleed
            viewport.innerHTML = '';
            var iframe = document.createElement('iframe');
            iframe.setAttribute('sandbox', 'allow-same-origin');
            iframe.srcdoc = html;
            viewport.appendChild(iframe);

            // Parse layout
            try {
                var layout = JSON.parse(layoutJson);
                _layoutElements = layout.elements || [];
                _layoutMap = {};
                for (var i = 0; i < _layoutElements.length; i++) {
                    var el = _layoutElements[i];
                    _layoutMap[el.selector] = el;
                }

                status.textContent = 'Loaded | ' + _layoutElements.length + ' elements';
            } catch (e) {
                _layoutElements = [];
                _layoutMap = {};
                status.textContent = 'Loaded | layout parse error';
            }

            // Show viewport, hide empty state
            container.style.display = '';
            emptyState.style.display = 'none';

            // Clear any existing highlights
            window.clearHighlight();
        };

        function findElement(selector) {
            // 1. Exact CSS selector match
            if (_layoutMap[selector]) return _layoutMap[selector];

            // 2. Match by attribute patterns like [data-testid="x"], #id, etc.
            for (var i = 0; i < _layoutElements.length; i++) {
                var el = _layoutElements[i];
                if (el.selector === selector) return el;
                // Match data-testid attribute
                if (el.attributes && el.attributes['data-testid'] &&
                    selector === '[data-testid="' + el.attributes['data-testid'] + '"]') return el;
                // Match by id
                if (el.attributes && el.attributes.id &&
                    selector === '#' + el.attributes.id) return el;
                // Match by role attribute
                if (el.attributes && el.attributes.role &&
                    selector === '[role="' + el.attributes.role + '"]') return el;
                // Match by placeholder
                if (el.attributes && el.attributes.placeholder &&
                    selector === '[placeholder="' + el.attributes.placeholder + '"]') return el;
            }

            // 3. Fuzzy match by text content
            var selectorLower = selector.toLowerCase();
            for (var j = 0; j < _layoutElements.length; j++) {
                var el2 = _layoutElements[j];
                if (el2.text && el2.text.toLowerCase().indexOf(selectorLower) !== -1) return el2;
            }

            // 4. Match by role
            for (var k = 0; k < _layoutElements.length; k++) {
                var el3 = _layoutElements[k];
                if (el3.role && el3.role === selector) return el3;
            }

            return null;
        }

        window.highlightElement = function(selector) {
            window.clearHighlight();

            var overlay = document.getElementById('overlay');
            var container = document.getElementById('viewport-container');
            var el = findElement(selector);

            var box = document.createElement('div');

            if (el && el.bounds) {
                box.className = 'highlight-box';
                box.style.left = el.bounds.x + 'px';
                box.style.top = el.bounds.y + 'px';
                box.style.width = el.bounds.w + 'px';
                box.style.height = el.bounds.h + 'px';
                overlay.appendChild(box);

                // Add tooltip with element info
                var tooltip = document.createElement('div');
                tooltip.className = 'highlight-tooltip';
                var info = '<' + el.tag + '>';
                if (el.role) info += ' role=' + el.role;
                if (el.text) info += ' "' + el.text.substring(0, 40) + '"';
                tooltip.textContent = info;
                tooltip.style.left = el.bounds.x + 'px';
                tooltip.style.top = Math.max(0, el.bounds.y - 22) + 'px';
                overlay.appendChild(tooltip);

                // Scroll into view if needed
                var scrollTop = container.scrollTop;
                var containerHeight = container.clientHeight;
                if (el.bounds.y < scrollTop || el.bounds.y + el.bounds.h > scrollTop + containerHeight) {
                    container.scrollTop = Math.max(0, el.bounds.y - 50);
                }
            } else {
                // Not found indicator
                box.className = 'highlight-box not-found';
                box.style.left = '10px';
                box.style.top = '10px';
                box.style.width = 'auto';
                box.style.height = '24px';
                box.textContent = 'Not found: ' + selector;
                box.style.color = '#ef4444';
                box.style.fontSize = '11px';
                box.style.padding = '4px 8px';
                box.style.fontFamily = 'monospace';
                overlay.appendChild(box);
            }
        };

        window.clearHighlight = function() {
            var overlay = document.getElementById('overlay');
            overlay.innerHTML = '';
        };

        // Inspect mode
        var _inspectMode = false;

        window.toggleInspectMode = function() {
            _inspectMode = !_inspectMode;
            document.body.classList.toggle('inspect-active', _inspectMode);
            var status = document.getElementById('status');
            if (_inspectMode) {
                status.textContent = 'Inspect Mode — click an element to pick it';
                setupInspectListeners();
            } else {
                status.textContent = 'Loaded | ' + _layoutElements.length + ' elements';
                removeInspectHighlight();
            }
        };

        function setupInspectListeners() {
            var overlay = document.getElementById('overlay');

            overlay.onmousemove = function(e) {
                if (!_inspectMode) return;
                removeInspectHighlight();

                var nearest = findNearestElement(e.offsetX, e.offsetY);
                if (nearest && nearest.bounds) {
                    var box = document.createElement('div');
                    box.className = 'inspect-highlight';
                    box.style.left = nearest.bounds.x + 'px';
                    box.style.top = nearest.bounds.y + 'px';
                    box.style.width = nearest.bounds.w + 'px';
                    box.style.height = nearest.bounds.h + 'px';
                    overlay.appendChild(box);

                    var tip = document.createElement('div');
                    tip.className = 'highlight-tooltip';
                    tip.style.borderColor = '#22c55e';
                    tip.textContent = nearest.selector;
                    tip.style.left = nearest.bounds.x + 'px';
                    tip.style.top = Math.max(0, nearest.bounds.y - 22) + 'px';
                    overlay.appendChild(tip);
                }
            };

            overlay.onclick = function(e) {
                if (!_inspectMode) return;
                var nearest = findNearestElement(e.offsetX, e.offsetY);
                if (nearest && window.__pickerCallback) {
                    window.__pickerCallback(JSON.stringify(nearest));
                }
                // Exit inspect mode
                window.toggleInspectMode();
            };
        }

        function findNearestElement(x, y) {
            var best = null;
            var bestArea = Infinity;
            for (var i = 0; i < _layoutElements.length; i++) {
                var el = _layoutElements[i];
                if (!el.bounds) continue;
                var b = el.bounds;
                if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
                    var area = b.w * b.h;
                    if (area < bestArea) {
                        bestArea = area;
                        best = el;
                    }
                }
            }
            return best;
        }

        function removeInspectHighlight() {
            var overlay = document.getElementById('overlay');
            var inspects = overlay.querySelectorAll('.inspect-highlight, .highlight-tooltip');
            for (var i = 0; i < inspects.length; i++) {
                inspects[i].remove();
            }
        }
    </script>
</body>
</html>
