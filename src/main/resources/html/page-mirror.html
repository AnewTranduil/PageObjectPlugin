<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Mirror</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1e1e1e;
            color: #cccccc;
            font-family: monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #status {
            padding: 8px 12px;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        #viewport-container {
            flex: 1;
            position: relative;
            overflow: auto;
            display: none;
        }
        #viewport-wrapper {
            position: relative;
            transform-origin: 0 0;
        }
        #viewport iframe {
            display: block;
            border: none;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        .highlight-box {
            position: absolute;
            border: 2px solid #3b82f6;
            background: rgba(59, 130, 246, 0.3);
            pointer-events: none;
            transition: all 0.15s ease;
        }
        .highlight-box.not-found {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
        }
        .highlight-tooltip {
            position: absolute;
            background: #1e1e1e;
            color: #ccc;
            border: 1px solid #3b82f6;
            border-radius: 3px;
            padding: 3px 6px;
            font-size: 11px;
            font-family: monospace;
            white-space: nowrap;
            pointer-events: none;
            z-index: 1001;
        }
        .inspect-highlight {
            position: absolute;
            border: 2px solid #22c55e;
            background: rgba(34, 197, 94, 0.2);
            pointer-events: none;
            z-index: 999;
        }
        .inspect-active #overlay {
            pointer-events: auto;
            cursor: crosshair;
        }
        #empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }
        /* Light theme overrides */
        body.theme-light {
            background: #ffffff;
            color: #333333;
        }
        body.theme-light #status {
            color: #666;
            border-bottom-color: #ddd;
        }
        body.theme-light .highlight-tooltip {
            background: #ffffff;
            color: #333;
        }
        body.theme-light #empty-state {
            color: #999;
        }
    </style>
</head>
<body>
    <div id="status">Page Mirror Ready</div>
    <div id="viewport-container">
        <div id="viewport-wrapper">
            <div id="viewport"></div>
            <div id="overlay"></div>
        </div>
    </div>
    <div id="empty-state">No snapshot loaded</div>

    <script>
        /* __JS_BUNDLE__ */
    </script>
</body>
</html>
