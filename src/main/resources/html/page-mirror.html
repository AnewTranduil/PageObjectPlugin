<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Mirror</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1e1e1e;
            color: #cccccc;
            font-family: monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #status {
            padding: 8px 12px;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }
        #viewport-container {
            flex: 1;
            position: relative;
            overflow: auto;
            display: none;
        }
        #viewport {
            width: 100%;
            height: 100%;
        }
        #viewport iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        .highlight-box {
            position: absolute;
            border: 2px solid #3b82f6;
            background: rgba(59, 130, 246, 0.3);
            pointer-events: none;
            transition: all 0.15s ease;
        }
        .highlight-box.not-found {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.2);
        }
        #empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="status">Page Mirror Ready</div>
    <div id="viewport-container">
        <div id="viewport"></div>
        <div id="overlay"></div>
    </div>
    <div id="empty-state">No snapshot loaded</div>

    <script>
        var _layoutElements = [];
        var _layoutMap = {};

        window.loadSnapshot = function(html, layoutJson) {
            var viewport = document.getElementById('viewport');
            var container = document.getElementById('viewport-container');
            var emptyState = document.getElementById('empty-state');
            var status = document.getElementById('status');

            // Create iframe with srcdoc to avoid CSS bleed
            viewport.innerHTML = '';
            var iframe = document.createElement('iframe');
            iframe.setAttribute('sandbox', 'allow-same-origin');
            iframe.srcdoc = html;
            viewport.appendChild(iframe);

            // Parse layout
            try {
                var layout = JSON.parse(layoutJson);
                _layoutElements = layout.elements || [];
                _layoutMap = {};
                for (var i = 0; i < _layoutElements.length; i++) {
                    var el = _layoutElements[i];
                    _layoutMap[el.selector] = el;
                }

                status.textContent = 'Loaded | ' + _layoutElements.length + ' elements';
            } catch (e) {
                _layoutElements = [];
                _layoutMap = {};
                status.textContent = 'Loaded | layout parse error';
            }

            // Show viewport, hide empty state
            container.style.display = '';
            emptyState.style.display = 'none';

            // Clear any existing highlights
            window.clearHighlight();
        };

        window.highlightElement = function(selector) {
            window.clearHighlight();

            var overlay = document.getElementById('overlay');
            var el = _layoutMap[selector];

            // Also try partial matching if exact match fails
            if (!el) {
                for (var key in _layoutMap) {
                    if (key === selector || selector === key) {
                        el = _layoutMap[key];
                        break;
                    }
                }
            }

            var box = document.createElement('div');

            if (el && el.bounds) {
                box.className = 'highlight-box';
                box.style.left = el.bounds.x + 'px';
                box.style.top = el.bounds.y + 'px';
                box.style.width = el.bounds.w + 'px';
                box.style.height = el.bounds.h + 'px';
            } else {
                // Not found indicator
                box.className = 'highlight-box not-found';
                box.style.left = '10px';
                box.style.top = '10px';
                box.style.width = '120px';
                box.style.height = '24px';
                box.textContent = 'Not found: ' + selector;
                box.style.color = '#ef4444';
                box.style.fontSize = '11px';
                box.style.padding = '4px';
                box.style.fontFamily = 'monospace';
            }

            overlay.appendChild(box);
        };

        window.clearHighlight = function() {
            var overlay = document.getElementById('overlay');
            overlay.innerHTML = '';
        };
    </script>
</body>
</html>
