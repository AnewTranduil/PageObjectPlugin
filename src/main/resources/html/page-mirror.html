<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Mirror</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1e1e1e;
            color: #cccccc;
            font-family: monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #status {
            padding: 8px 12px;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid #333;
        }
        #viewport-container {
            flex: 1;
            position: relative;
            overflow: auto;
        }
        #viewport {
            width: 100%;
            height: 100%;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }
        .highlight-box {
            position: absolute;
            border: 2px solid #528bff;
            background: rgba(82, 139, 255, 0.15);
            pointer-events: none;
        }
        #empty-state {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
